name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  # Permite lanzarlo manualmente desde la pestaña "Actions" de GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se crucen dos publicaciones al mismo tiempo.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        run: npm run build
        env:
          # Se define solo si el repositorio NO es "<usuario>.github.io".
          # GitHub la expone automáticamente con el nombre real del repo.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}

      - name: Preparar archivos para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
